<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>내 데이터 AI 비서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 첫 렌더 전에 테마 적용 (깜빡임 방지)
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn only-mobile" id="sidebarToggle" aria-label="대화 목록 열기">☰</button>
    <h1 class="brand">내 데이터 <span>AI 비서</span></h1>
    <span class="status" id="serverStatus" data-state="pending">서버 확인 중…</span>
    <button class="icon-btn" id="themeToggle" aria-label="다크 모드 전환" title="다크 모드 전환">🌙</button>
  </header>

  <div class="notice" id="coldStartNotice" hidden>
    서버를 깨우는 중이에요. 무료 서버는 한동안 요청이 없으면 잠들어서, 첫 접속에 최대 1분 정도 걸릴 수 있어요.
  </div>

  <div class="layout">
    <!-- 대화 기록 -->
    <aside class="sidebar" id="sidebar">
      <button class="btn primary block" id="newChatBtn">+ 새 대화</button>
      <h2 class="side-title">이전 대화</h2>
      <ul class="conv-list" id="convList"></ul>
      <p class="muted small" id="convEmpty">아직 저장된 대화가 없어요.</p>
    </aside>

    <main class="main">
      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="chat" aria-selected="true">채팅</button>
        <button class="tab" role="tab" data-tab="data" aria-selected="false">데이터 관리</button>
      </nav>

      <!-- 채팅 -->
      <section class="panel" id="panel-chat">
        <div class="summary-strip" id="summaryStrip">요약을 불러오는 중…</div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="chatForm">
          <textarea id="chatInput" rows="1" maxlength="2000" placeholder="예: 이번 달 실적이 어때?" required></textarea>
          <button class="btn primary" id="sendBtn" type="submit">보내기</button>
        </form>
      </section>

      <!-- 데이터 관리 -->
      <section class="panel" id="panel-data" hidden>
        <div class="cards" id="summaryCards"></div>

        <div class="card">
          <div class="card-head">
            <h3>추세 그래프</h3>
            <span class="muted small">일별 값 · 7일 이동평균</span>
          </div>
          <canvas id="chart" height="240" aria-label="일별 데이터 추세 그래프"></canvas>
        </div>

        <div class="card">
          <h3 id="formTitle">새 데이터 추가</h3>
          <form class="data-form" id="dataForm">
            <label>날짜<input type="date" id="fDate" required /></label>
            <label>값<input type="number" id="fValue" min="0" step="any" required placeholder="250000" /></label>
            <label class="grow">메모<input type="text" id="fMemo" maxlength="200" placeholder="선택" /></label>
            <div class="form-actions">
              <button class="btn primary" type="submit" id="formSubmit">추가</button>
              <button class="btn" type="button" id="formCancel" hidden>취소</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>데이터 목록 <span class="muted small" id="dataCount"></span></h3>
            <div class="export">
              <button class="btn small" id="exportCsv">CSV 내보내기</button>
              <button class="btn small" id="exportJson">JSON 내보내기</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>날짜</th><th class="num">값</th><th>메모</th><th></th></tr></thead>
              <tbody id="dataBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
